<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <!-- Base moon gradient: bright center, darker toward limb -->
    <radialGradient id="moonBase" cx="42%" cy="38%" r="55%">
      <stop offset="0%"  stop-color="#E8E8E0"/>
      <stop offset="35%" stop-color="#C8C8BC"/>
      <stop offset="70%" stop-color="#9A9A90"/>
      <stop offset="100%" stop-color="#5A5A54"/>
    </radialGradient>
    <!-- Limb darkening overlay -->
    <radialGradient id="limbDark" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="transparent"/>
      <stop offset="100%" stop-color="rgba(10,10,10,0.65)"/>
    </radialGradient>
    <!-- Mare (dark regions) -->
    <radialGradient id="mare1" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="rgba(70,72,80,0.75)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <radialGradient id="mare2" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="rgba(60,65,75,0.6)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <radialGradient id="mare3" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="rgba(55,60,68,0.55)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <!-- Crater highlight gradient -->
    <radialGradient id="craterHL" cx="35%" cy="30%" r="60%">
      <stop offset="0%"  stop-color="rgba(240,240,230,0.9)"/>
      <stop offset="50%" stop-color="rgba(160,160,150,0.5)"/>
      <stop offset="100%" stop-color="rgba(80,80,74,0.7)"/>
    </radialGradient>
    <radialGradient id="craterHL2" cx="40%" cy="35%" r="60%">
      <stop offset="0%"  stop-color="rgba(235,235,225,0.85)"/>
      <stop offset="50%" stop-color="rgba(155,155,145,0.45)"/>
      <stop offset="100%" stop-color="rgba(75,75,70,0.65)"/>
    </radialGradient>
    <!-- Soft glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softBlur">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>
    <filter id="craterBlur">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
    <clipPath id="moonClip">
      <circle cx="200" cy="200" r="195"/>
    </clipPath>
  </defs>

  <!-- Moon disk -->
  <circle cx="200" cy="200" r="195" fill="url(#moonBase)"/>

  <!-- Mare Imbrium — large dark sea, upper-left -->
  <g clip-path="url(#moonClip)">
    <ellipse cx="155" cy="155" rx="88" ry="72" fill="url(#mare1)" filter="url(#softBlur)"/>
    <!-- Mare Serenitatis — upper right -->
    <ellipse cx="258" cy="148" rx="60" ry="52" fill="url(#mare2)" filter="url(#softBlur)"/>
    <!-- Mare Tranquillitatis — center right -->
    <ellipse cx="265" cy="210" rx="58" ry="48" fill="url(#mare3)" filter="url(#softBlur)"/>
    <!-- Mare Crisium — right edge, small oval -->
    <ellipse cx="305" cy="160" rx="32" ry="26" fill="url(#mare1)" filter="url(#softBlur)" opacity="0.7"/>
    <!-- Mare Nubium — lower left -->
    <ellipse cx="175" cy="268" rx="52" ry="40" fill="url(#mare2)" filter="url(#softBlur)" opacity="0.8"/>
    <!-- Oceanus Procellarum — left, large diffuse -->
    <ellipse cx="118" cy="215" rx="68" ry="90" fill="url(#mare3)" filter="url(#softBlur)" opacity="0.6"/>
    <!-- Mare Humorum — lower left small -->
    <ellipse cx="142" cy="300" rx="30" ry="24" fill="url(#mare1)" filter="url(#softBlur)" opacity="0.65"/>
    <!-- Mare Fecunditatis — right center -->
    <ellipse cx="298" cy="240" rx="42" ry="36" fill="url(#mare2)" filter="url(#softBlur)" opacity="0.7"/>

    <!-- Tycho crater — lower center, bright with rays -->
    <circle cx="190" cy="302" r="12" fill="url(#craterHL)" filter="url(#craterBlur)"/>
    <circle cx="190" cy="302" r="8" fill="rgba(230,230,218,0.85)"/>
    <circle cx="190" cy="302" r="4" fill="rgba(200,200,188,0.5)"/>
    <!-- Tycho ray system (faint lines) -->
    <line x1="190" y1="302" x2="140" y2="200" stroke="rgba(210,210,200,0.12)" stroke-width="2"/>
    <line x1="190" y1="302" x2="260" y2="180" stroke="rgba(210,210,200,0.10)" stroke-width="2"/>
    <line x1="190" y1="302" x2="100" y2="310" stroke="rgba(210,210,200,0.10)" stroke-width="1.5"/>
    <line x1="190" y1="302" x2="280" y2="360" stroke="rgba(210,210,200,0.09)" stroke-width="1.5"/>
    <line x1="190" y1="302" x2="320" y2="250" stroke="rgba(210,210,200,0.08)" stroke-width="1.5"/>

    <!-- Copernicus crater — center left, prominent -->
    <circle cx="162" cy="213" r="16" fill="url(#craterHL2)" filter="url(#craterBlur)"/>
    <circle cx="162" cy="213" r="11" fill="rgba(195,195,183,0.7)"/>
    <circle cx="162" cy="213" r="5" fill="rgba(170,170,158,0.4)"/>

    <!-- Plato — upper dark floor crater -->
    <circle cx="158" cy="118" r="14" fill="rgba(80,82,88,0.8)" filter="url(#craterBlur)"/>
    <circle cx="158" cy="118" r="10" fill="rgba(70,72,78,0.9)"/>
    <circle cx="155" cy="115" r="10" stroke="rgba(200,200,190,0.5)" stroke-width="1.5" fill="none"/>

    <!-- Aristarchus — left, bright -->
    <circle cx="108" cy="178" r="8" fill="rgba(240,242,232,0.9)" filter="url(#craterBlur)"/>
    <circle cx="108" cy="178" r="5" fill="rgba(250,252,242,0.95)"/>

    <!-- Clavius — lower left, large -->
    <circle cx="148" cy="338" r="18" fill="url(#craterHL)" filter="url(#craterBlur)" opacity="0.8"/>
    <circle cx="148" cy="338" r="12" fill="rgba(185,185,173,0.55)"/>
    <!-- Small craters inside Clavius -->
    <circle cx="155" cy="330" r="5" fill="rgba(200,200,188,0.5)"/>
    <circle cx="142" cy="344" r="4" fill="rgba(200,200,188,0.45)"/>

    <!-- Kepler — center, medium -->
    <circle cx="128" cy="230" r="7" fill="rgba(225,225,213,0.75)" filter="url(#craterBlur)"/>
    <circle cx="128" cy="230" r="4" fill="rgba(238,238,226,0.85)"/>

    <!-- Grimaldi — left edge, dark floor -->
    <circle cx="66" cy="220" r="12" fill="rgba(65,68,74,0.85)" filter="url(#craterBlur)"/>
    <circle cx="66" cy="220" r="8" fill="rgba(55,58,64,0.9)"/>

    <!-- Cassini — upper area -->
    <circle cx="215" cy="130" r="8" fill="rgba(160,162,155,0.6)" filter="url(#craterBlur)"/>
    <circle cx="215" cy="130" r="5" fill="rgba(145,147,140,0.5)"/>

    <!-- Langrenus — right edge -->
    <circle cx="325" cy="220" r="10" fill="url(#craterHL2)" filter="url(#craterBlur)" opacity="0.75"/>
    <circle cx="325" cy="220" r="6" fill="rgba(200,200,188,0.6)"/>

    <!-- Random small craters for texture -->
    <circle cx="245" cy="90"  r="5" fill="rgba(210,210,198,0.5)" filter="url(#craterBlur)"/>
    <circle cx="300" cy="120" r="4" fill="rgba(190,190,178,0.45)" filter="url(#craterBlur)"/>
    <circle cx="340" cy="175" r="5" fill="rgba(205,205,193,0.4)" filter="url(#craterBlur)"/>
    <circle cx="80"  cy="150" r="4" fill="rgba(185,185,173,0.4)" filter="url(#craterBlur)"/>
    <circle cx="350" cy="290" r="6" fill="rgba(195,195,183,0.45)" filter="url(#craterBlur)"/>
    <circle cx="230" cy="355" r="5" fill="rgba(200,200,188,0.4)" filter="url(#craterBlur)"/>
    <circle cx="100" cy="290" r="4" fill="rgba(188,188,176,0.4)" filter="url(#craterBlur)"/>
    <circle cx="310" cy="330" r="5" fill="rgba(192,192,180,0.4)" filter="url(#craterBlur)"/>
    <circle cx="180" cy="80"  r="4" fill="rgba(215,215,203,0.4)" filter="url(#craterBlur)"/>
    <circle cx="270" cy="310" r="4" fill="rgba(195,195,183,0.35)" filter="url(#craterBlur)"/>

    <!-- Limb darkening overlay (darkens the edges of the disk) -->
    <circle cx="200" cy="200" r="195" fill="url(#limbDark)"/>

    <!-- Subtle surface sheen / terminator-side shadow -->
    <ellipse cx="340" cy="200" rx="85" ry="195" fill="rgba(10,12,20,0.18)" filter="url(#softBlur)"/>
  </g>

  <!-- Outer atmospheric glow ring -->
  <circle cx="200" cy="200" r="196" fill="none" stroke="rgba(200,210,255,0.12)" stroke-width="6"/>
  <circle cx="200" cy="200" r="198" fill="none" stroke="rgba(160,180,255,0.06)" stroke-width="10"/>
</svg>
