<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 200 200"
  width="200"
  height="200"
  fill="none"
>
  <defs>
    <filter id="neonGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="neonGlowStrong" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer diamond -->
  <polygon
    points="100,10 190,100 100,190 10,100"
    stroke="#FF0033"
    stroke-width="3"
    fill="none"
    filter="url(#neonGlowStrong)"
  />

  <!-- Inner diamond -->
  <polygon
    points="100,35 165,100 100,165 35,100"
    stroke="#FF0033"
    stroke-width="1.5"
    fill="none"
    filter="url(#neonGlow)"
    opacity="0.55"
  />
</svg>
